name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.7
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os != 'Windows'
        run: go build -trimpath -ldflags="-s -w" -o steady-picker ./cmd/steady-picker
      - if: runner.os != 'Windows'
        run: |
          printf '%s\n' '{"prompt":"a flower transforming in a timelapse","mode":"text-to-video"}' |
            ./steady-picker predict |
            grep '"duration":6'
          printf '%s\n' '{"prompt":"a flower transforming in a timelapse","mode":"text-to-video"}' |
            ./steady-picker predict --model models/settings-v1.bin --model-version custom-v1 |
            grep '"model_version":"custom-v1"'
      - if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-s -w" -o steady-picker.exe ./cmd/steady-picker
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          '{"prompt":"a flower transforming in a timelapse","mode":"text-to-video"}' |
            .\steady-picker.exe predict |
            Select-String '"duration":6'
          '{"prompt":"a flower transforming in a timelapse","mode":"text-to-video"}' |
            .\steady-picker.exe predict --model models/settings-v1.bin --model-version custom-v1 |
            Select-String '"model_version":"custom-v1"'
