name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.7
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - run: go build -trimpath -o steady-picker${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/steady-picker
      - if: runner.os != 'Windows'
        run: |
          ./steady-picker health
          printf '%s\n%s\n' \
            '{"prompt":"one normal action","mode":"text-to-video"}' \
            '{"prompt":"render for 3 seconds at 720p","mode":"text-to-video"}' |
            ./steady-picker predict --profile quota-safe-v2 |
            grep '"artifact_sha256"'
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\steady-picker.exe health
          '{"prompt":"one normal action","mode":"text-to-video"}' |
            .\steady-picker.exe predict --profile quota-safe-v2 |
            Select-String '"artifact_sha256"'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.7
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: go
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
